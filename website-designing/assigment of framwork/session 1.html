<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Intro Assignment</title>

    <!-- TASK 1: Official Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container my-4">

        <!-- TASK 1: Test Button to verify Bootstrap setup -->
        <div class="mb-4 text-end">
            <button class="btn btn-primary">Test Button</button>
        </div>

        <!-- TASK 2: Full-width row with centered heading -->
        <div class="row mb-5">
            <div class="col-12 text-center">
                <h1 class="display-4 fw-bold text-primary">Welcome to My Playlist</h1>
            </div>
        </div>

        <!-- TASKS 3 & 4:(Profile Pic, Bio, Music Apps List) -->
        <div class="row align-items-center g-4">

            <!-- Column 1: Instagram Profile Picture -->
            <div class="col-12 col-md-4 text-center">
                <img src="https://img.magnific.com/premium-photo/joyful-asian-game-developer-headshot-vibrant-3d-cartoon-style-showcasing-big-smile_1283595-35755.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="Instagram Profile Picture"
                    class="img-fluid rounded-circle border border-3 border-primary shadow-sm" style="max-width: 220px;">
            </div>

            <!-- Column 2: Bio Description-->
            <div class="col-12 col-md-5">
                <h3 class="fw-bold mb-2">Jay Pambhar</h3>
                <p class="text-secondary mb-2">@jaypambhar_music</p>
                <p class="lead fs-6">
                    Music enthusiast, playlist curator, and indie pop lover. Always hunting for new tracks and live
                    concert experiences.
                </p>
            </div>

            <!-- TASK 4: Column 3: Music Apps List Group-->
            <div class="col-12 col-md-3">
                <h6 class="fw-bold mb-3 text-uppercase text-muted">Favorite Music Apps</h6>
                <ul class="list-group shadow-sm">
                    <li class="list-group-item d-flex align-items-center">
                        <span class="badge bg-success rounded-pill me-2">1</span> Spotify
                    </li>
                    <li class="list-group-item d-flex align-items-center">
                        <span class="badge bg-danger rounded-pill me-2">2</span> YouTube Music
                    </li>
                    <li class="list-group-item d-flex align-items-center">
                        <span class="badge bg-primary rounded-pill me-2">3</span> Wynk
                    </li>
                </ul>
            </div>

        </div>

    </div>

</body>

</html>
