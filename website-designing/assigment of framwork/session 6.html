<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailwind CSS UI Components</title>
  <!-- 1. Tailwind CSS CDN Script -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- 1. Verified setup with sky-200 background color -->

<body class="bg-sky-200 min-h-screen p-4 md:p-8 space-y-12">

  <!-- 3. Spotify-Style Horizontal Navigation Bar -->
  <nav class="bg-zinc-900 text-white py-4 px-6 rounded-xl shadow-lg max-w-4xl mx-auto">
    <div class="flex justify-between items-center max-w-md mx-auto font-medium text-sm md:text-base">
      <a href="#" class="hover:text-green-500 transition-colors">Home</a>
      <a href="#" class="hover:text-green-500 transition-colors">Search</a>
      <a href="#" class="hover:text-green-500 transition-colors">Your Library</a>
    </div>
  </nav>

  <!-- 2. Instagram-Style Profile Card -->
  <section class="max-w-xs mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-6 border border-gray-100">
    <div class="flex flex-col items-center text-center space-y-4">
      <!-- Circular Profile Image -->
      <img class="w-24 h-24 rounded-full object-cover ring-4 ring-pink-500 p-1"
        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300"
        alt="Profile Avatar" />
      <!-- Username -->
      <div>
        <h2 class="text-xl font-bold text-gray-800">alexa_designs</h2>
        <p class="text-xs text-gray-500 font-medium">Digital Creator</p>
      </div>
      <!-- Follow Button with Custom Colors -->
      <button
        class="w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md hover:shadow-lg transition-all duration-200">
        Follow
      </button>
    </div>
  </section>

  <!-- 4. Zomato-Style Featured Restaurant Banner -->
  <section
    class="max-w-4xl mx-auto h-80 rounded-2xl bg-gradient-to-r from-red-600 via-rose-500 to-red-500 text-white shadow-2xl p-6 flex flex-col justify-center items-center text-center space-y-4">
    <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">
      Discover the Best Food & Drinks
    </h1>
    <p class="text-lg md:text-xl text-red-100 font-medium max-w-xl">
      Explore top-rated restaurants, cafes, and bars around you
    </p>
    <button
      class="bg-white text-red-600 hover:bg-red-50 font-bold py-3 px-8 rounded-full shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 mt-2">
      Explore Now
    </button>
  </section>

</body>

</html>
