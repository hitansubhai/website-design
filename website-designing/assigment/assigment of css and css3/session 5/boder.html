<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .spotify-card {
            width: 220px;
            background-color: #121212;
            color: #ffffff;
            padding: 16px;
            border-radius: 12px;
            /* Rounded card corners */
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .artist-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            /* Rounded image corners */
        }
    </style>
</head>

<body>
    <div class="spotify-card">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300" class="artist-img">
        <h3>The Weeknd</h3>
        <p>Artist • 85M Monthly Listeners</p>
    </div>
</body>

</html>
