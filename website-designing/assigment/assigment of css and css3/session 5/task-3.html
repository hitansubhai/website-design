<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .movie-card {
            width: 280px;
            height: 380px;
            background: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400') center/cover;
            display: flex;
            align-items: flex-end;
            padding: 20px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .movie-title {
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            margin: 0;
            /* Dark contrasting text shadow for readability */
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>

<body>
    <div class="movie-card">
        <h1 class="movie-title">AVENGERS</h1>
    </div>
</body>

</html>
