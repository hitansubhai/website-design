<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .restaurant-card {
            width: 320px;
            height: 200px;
            /* Free food photo background */
            background-image: url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=500');
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .restaurant-info {
            width: 100%;
            padding: 12px;
            color: #ffffff;
            /* Semi-transparent dark background overlay */
            background: rgba(0, 0, 0, 0.65);
        }

        .restaurant-info h2,
        .restaurant-info p {
            margin: 4px 0;
        }
    </style>
</head>

<body>
    <div class="restaurant-info">
        <h2>Spice & Grill</h2>
        <p>North Indian • Chinese • ₹300 for one</p>
    </div>
    </div>
</body>

</html>
